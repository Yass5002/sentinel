name: sentinel
description: "A personal safety app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Networking
  dio: ^5.5.0+1

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Models & JSON
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Location & Background
  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  flutter_foreground_task: ^8.1.0

  # Notifications
  flutter_local_notifications: ^17.2.1+1

  # Utils
  file_picker: ^10.3.10
  shimmer: ^3.0.0
  intl: ^0.19.0
  timeago: ^3.7.1
  mime: ^2.0.0
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  fonts:
    - family: SentinelBrand
      fonts:
        - asset: assets/fonts/Radically Changed Demo.ttf
