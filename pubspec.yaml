name: sentinel
description: "A personal safety app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Networking
  dio: ^5.5.0+1

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Models & JSON
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Permission handling
  permission_handler: ^12.0.1

  # Notifications
  flutter_local_notifications: ^20.1.0

  # Utils
  file_picker: ^10.3.10
  shimmer: ^3.0.0
  intl: ^0.20.2
  timeago: ^3.7.1
  mime: ^2.0.0
  http_parser: ^4.1.2
  timezone: ^0.10.1
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.2
  connectivity_plus: ^7.0.0
  path_provider: ^2.1.5
  open_file: ^3.5.11
  flag: ^7.0.2
  google_fonts: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.2

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/logo.png"
  min_sdk_android: 26
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/logo.png"

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: SentinelBrand
      fonts:
        - asset: assets/fonts/Radically Changed Demo.ttf
    - family: Alyamama
      fonts:
        - asset: assets/fonts/Alyamama-VariableFont_wght.ttf
